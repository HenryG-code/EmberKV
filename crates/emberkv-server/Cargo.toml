[package]
name = "emberkv-server"
description = "The EmberKV network server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The program is called `emberkv`, not `emberkv-server`.
[[bin]]
name = "emberkv"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
emberkv-storage = { version = "0.1.0", path = "../emberkv-storage" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
