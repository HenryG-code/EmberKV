# cargo-deny checks every dependency against these rules in CI.

[graph]
all-features = true

# Known security vulnerabilities (RustSec advisory database) fail the build.
[advisories]
ignore = []

# Only permissive licences compatible with MIT OR Apache-2.0.
[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Dependencies may only come from crates.io.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
